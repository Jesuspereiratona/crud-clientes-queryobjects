<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 30px auto; }
        h2 { margin-top: 24px; }
        input { padding: 6px; margin: 3px 0; width: 100%; box-sizing: border-box; }
        button { padding: 6px 14px; margin-top: 6px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid #ddd; padding: 6px; }
        #mensaje { font-weight: bold; }
    </style>
</head>

<body>
    <h2>Crear cliente</h2>
    <form id="crear">
        <input id="c_nombre" placeholder="nombre">
        <input id="c_rut" placeholder="rut">
        <input id="c_edad" placeholder="edad">
        <button>Crear</button>
    </form>

    <h2>Buscar</h2>
    <form id="buscar">
        <input id="b_rut" placeholder="rut (opcional)">
        <input id="b_edad" placeholder="edad (opcional)">
        <input id="b_nombre" placeholder="nombre, completo o prefijo (opcional)">
        <button>Buscar</button>
    </form>

    <h2>Modificar nombre</h2>
    <form id="modificar">
        <input id="m_rut" placeholder="rut">
        <input id="m_nombre" placeholder="nuevo nombre">
        <button>Modificar</button>
    </form>

    <h2>Eliminar</h2>
    <form id="eliminar">
        <input id="e_rut" placeholder="rut (opcional)">
        <input id="e_edad" placeholder="edad (opcional)">
        <input id="e_nombre" placeholder="nombre (opcional)">
        <button>Eliminar</button>
    </form>

    <p id="mensaje"></p>
    <table id="tabla" border="1">
        <tr><th>rut</th><th>nombre</th><th>edad</th></tr>
    </table>

    <script>
        const API = "http://localhost:3000/clientes"
        const mensaje = document.getElementById("mensaje")
        const tabla = document.getElementById("tabla")

        function pintar(clientes) {
            tabla.innerHTML = "<tr><th>rut</th><th>nombre</th><th>edad</th></tr>"
            clientes.forEach(c => {
                tabla.innerHTML += `<tr><td>${c.rut}</td><td>${c.nombre}</td><td>${c.edad}</td></tr>`
            })
        }

        crear.addEventListener("submit", async (e) => {
            e.preventDefault()
            const r = await fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre: c_nombre.value, rut: c_rut.value, edad: c_edad.value })
            })
            const json = await r.json()
            mensaje.textContent = json.mensaje || (json.ok ? "cliente creado" : "")
            if (json.ok) pintar([json.data])
        })

        buscar.addEventListener("submit", async (e) => {
            e.preventDefault()
            const params = new URLSearchParams()
            if (b_rut.value) params.set("rut", b_rut.value)
            if (b_edad.value) params.set("edad", b_edad.value)
            if (b_nombre.value) params.set("nombre", b_nombre.value)

            const r = await fetch(`${API}?${params}`)
            const json = await r.json()
            mensaje.textContent = json.ok ? "" : json.mensaje
            if (json.ok) pintar(json.data)
        })

        modificar.addEventListener("submit", async (e) => {
            e.preventDefault()
            const r = await fetch(`${API}/${m_rut.value}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre: m_nombre.value })
            })
            const json = await r.json()
            mensaje.textContent = `${json.mensaje} (rowCount: ${json.rowCount ?? 0})`
        })

        eliminar.addEventListener("submit", async (e) => {
            e.preventDefault()
            const params = new URLSearchParams()
            if (e_rut.value) params.set("rut", e_rut.value)
            if (e_edad.value) params.set("edad", e_edad.value)
            if (e_nombre.value) params.set("nombre", e_nombre.value)

            const r = await fetch(`${API}?${params}`, { method: "DELETE" })
            const json = await r.json()
            mensaje.textContent = `${json.mensaje} (rowCount: ${json.rowCount ?? 0})`
        })
    </script>
</body>

</html>
